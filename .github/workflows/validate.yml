name: validate

on:
  push:
    branches: [main, "fix/**", "dev-team/**", "refactor/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check SKILL.md frontmatter
        run: |
          python3 - <<'EOF'
          import os, re, sys
          bad = []
          n = 0
          # Catalog landing pages, not skills (no SKILL.md by design)
          SKIP = {"awesome-muse-skills"}
          for d in sorted(os.listdir("skills")):
              if d in SKIP:
                  continue
              p = os.path.join("skills", d, "SKILL.md")
              if not os.path.exists(p):
                  bad.append(f"{d}: thiếu SKILL.md"); continue
              n += 1
              with open(p, encoding="utf-8", errors="replace") as f:
                  head = f.read(4000)
              m = re.match(r"^---\n(.*?)\n---", head, re.S)
              if not m:
                  bad.append(f"{d}: thiếu frontmatter"); continue
              fm = m.group(1)
              if not re.search(r"^name:\s*\S+", fm, re.M): bad.append(f"{d}: thiếu name")
              if not re.search(r"^description:", fm, re.M): bad.append(f"{d}: thiếu description")
          print(f"skills: {n} checked")
          if bad:
              print("ERRORS:"); [print(" -", b) for b in bad]; sys.exit(1)
          print("frontmatter OK")
          EOF

      - name: Check connector SKILL.md frontmatter
        run: |
          python3 - <<'EOF'
          import os, re, sys
          bad = []
          n = 0
          # _template is a scaffold, not a connector
          SKIP = {"_template"}
          for d in sorted(os.listdir("connectors")):
              if d in SKIP or not os.path.isdir(os.path.join("connectors", d)):
                  continue
              p = os.path.join("connectors", d, "SKILL.md")
              if not os.path.exists(p):
                  bad.append(f"{d}: thiếu SKILL.md"); continue
              n += 1
              with open(p, encoding="utf-8", errors="replace") as f:
                  head = f.read(4000)
              m = re.match(r"^---\n(.*?)\n---", head, re.S)
              if not m:
                  bad.append(f"{d}: thiếu frontmatter"); continue
              fm = m.group(1)
              for field in ("name", "description", "tagline", "catalog_auth", "catalog_hosts"):
                  if not re.search(rf"^{field}:", fm, re.M): bad.append(f"{d}: thiếu {field}")
              nm = re.search(r"^name:\s*\"?([^\"\n]+?)\"?\s*$", fm, re.M)
              if nm and nm.group(1) != d: bad.append(f"{d}: name '{nm.group(1)}' != tên thư mục")
              # Mọi file kê trong ## Files phải tồn tại thật (không ép bin/*.py:
              # vd mushare chỉ có SKILL.md, files giao qua manifest từ xa)
              full = open(p, encoding="utf-8", errors="replace").read()
              mf = re.search(r"^## Files\s*$(.*?)(?=^## |\Z)", full, re.S | re.M)
              if not mf:
                  bad.append(f"{d}: không có mục ## Files")
              else:
                  for line in mf.group(1).splitlines():
                      line = line.strip()
                      if not line.startswith("- "): continue
                      tok = line[2:].strip().strip("`").split()[0].rstrip(".,)")
                      if "://" in tok or not re.search(r"\.(md|py|json|sh|txt)$", tok): continue
                      if not os.path.exists(os.path.join("connectors", d, tok)):
                          bad.append(f"{d}: ## Files kê '{tok}' nhưng không tồn tại")
          print(f"connectors: {n} checked")
          if bad:
              print("ERRORS:"); [print(" -", b) for b in bad]; sys.exit(1)
          print("connector frontmatter OK")
          EOF

      - name: Check workflow syntax (strip export, AsyncFunction parse)
        run: |
          node -e "
          const fs = require('fs');
          const AsyncFunction = Object.getPrototypeOf(async function(){}).constructor;
          for (const f of fs.readdirSync('workflows').filter(f => f.endsWith('.js'))) {
            let src = fs.readFileSync('workflows/' + f, 'utf8');
            src = src.replace(/^\s*export\s+const\s+meta/m, 'const meta');
            if (/^\s*(import|export)\s/m.test(src)) throw new Error(f + ': chứa import/export không hỗ trợ');
            new AsyncFunction('agent', 'args', 'phase', 'log', src);
            console.log(f, 'syntax OK');
          }"

      - name: Run gate tests (mock agent)
        run: node docs/tests/run-tests.mjs

      - name: Run benchmark
        run: node docs/tests/benchmark.mjs
